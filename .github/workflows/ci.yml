name: CI

# Relicbound's game logic lives in pure C# class libraries with no Godot
# dependency, which is what makes this workflow possible: CI can build and
# test the entire simulation without ever installing the engine.
#
# The Godot project is built too (Godot.NET.Sdk restores from NuGet), which
# catches broken project references without needing the editor.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Relicbound.sln

      - name: Build
        run: dotnet build Relicbound.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Relicbound.sln --configuration Release --no-build --verbosity normal
